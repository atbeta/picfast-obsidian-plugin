name: CI

# Run tests on every push to master and on every PR. The release
# workflow handles `git tag`-pushed builds and uploads `main.js` to a
# GitHub Release — the artifact from this job would only be collected
# once and immediately discarded, so we no longer upload it here.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build