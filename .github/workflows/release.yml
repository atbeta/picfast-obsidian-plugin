name: Release

# Build + attach `main.js` / `manifest.json` / `styles.css` to a GitHub
# Release whenever a tag matching `v*` is pushed. Pre-release detection
# uses the prerelease flag on the tag itself (`git tag v0.3.0-rc.1` →
# pre-release; `git tag v0.3.0` → stable).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp main.js manifest.json styles.css release-assets/
          if [ -f versions.json ]; then cp versions.json release-assets/; fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
            release-assets/versions.json